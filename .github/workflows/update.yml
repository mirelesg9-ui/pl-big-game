name: Build and publish

on:
  schedule:
    - cron: "17 9 * * 2"   # Tuesdays 09:17 UTC, after the gameweek ends
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cache past seasons
        uses: actions/cache@v4
        with:
          path: cache
          key: fpl-archive-${{ github.run_id }}
          restore-keys: fpl-archive-
      - run: python pipeline/fetch.py
      - run: python pipeline/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
